[project]
name = "pogocal"
version = "0.1.0"
description = "Turns Pokémon GO event announcements into a subscribable calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
]

[project.scripts]
pogocal = "pogocal.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pogocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
