# Rebuilds the calendar every hour and commits it when it has changed.
#
# The whole job is one command. `pogocal run` fetches the Leek Duck feed, reads
# the Discord channel, matches posts to events, and writes docs/pogo.ics, which
# GitHub Pages serves. Nothing here costs anything: Actions and Pages are free
# on a public repository, and neither data source charges.
#
# Two things make this safe to run unattended:
#
#   * The output is byte-identical when nothing has changed, so the commit step
#     below almost always finds nothing to do. Without that this would commit
#     24 times a day and bury real changes in noise. The web page depends on
#     the date as well, so it changes at most once a day on its own.
#   * Infographics are fetched once and deleted when their event has finished.
#     GitHub Pages stops publishing a site over 1 GB; pruning is what keeps the
#     published folder at tens of megabytes rather than growing without limit.
#   * A missing token or an unreachable Discord costs the infographic links for
#     that run, not the calendar. Only a feed failure stops the rebuild, and
#     then the previously published file is left in place.

name: Update calendar

on:
  schedule:
    # Hourly, on the hour, UTC. GitHub's scheduler is best-effort and often
    # runs several minutes late; at this cadence that does not matter.
    - cron: "0 * * * *"
  # So it can be triggered by hand from the Actions tab rather than waiting an
  # hour to find out whether a change works.
  workflow_dispatch:

# The job commits to the repository, which needs more than the default
# read-only token.
permissions:
  contents: write

# Never let two runs commit at once. A scheduled run overlapping a manual one
# would race on the push.
concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version: unlike actions/checkout, this action
      # publishes no floating major tag, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # uv installs the Python version pyproject.toml asks for, so there is
          # no separate setup-python step.
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Rebuild the calendar
        env:
          # The only secret. The two IDs below are not secret - both appear in
          # every link the calendar publishes.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: "772532010555670530"
          CHANNEL_ID: "1173052217050267679"
        # Kept so the summary step below can show what this run saw. tee sends
        # it to both the live log and the file; PIPESTATUS is the exit code of
        # pogocal rather than of tee, which always succeeds.
        run: |
          set -o pipefail
          uv run pogocal run 2>&1 | tee /tmp/run.log

      # Written whether the rebuild worked or not, so a failed run says why on
      # its own summary page instead of only in the raw log.
      - name: Say what this run saw
        if: always()
        run: |
          {
            if [ -f /tmp/run.log ]; then
              grep -E "^docs/pogo.ics:" /tmp/run.log || echo "the rebuild did not get as far as writing a calendar"
              echo
              grep -E "posts matched an event|feed returned" /tmp/run.log || true
              echo
              echo "<details><summary>Full output</summary>"
              echo
              echo '```'
              cat /tmp/run.log
              echo '```'
              echo
              echo "</details>"
            else
              echo "The rebuild step produced no output. Check the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, but only if something changed
        run: |
          # git status, not git diff: a newly downloaded infographic is an
          # untracked file, and git diff cannot see those. Checking only the
          # calendar, as this step used to, would publish the page and the
          # images never.
          if [ -z "$(git status --porcelain -- docs/)" ]; then
            echo "nothing changed - nothing to commit"
            exit 0
          fi

          echo "changed:"
          git status --short -- docs/
          du -sh docs/img 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          git commit -m "Update calendar

          Rebuilt from the Leek Duck feed and the Discord channel by the
          scheduled job. Committing is what keeps the schedule alive: GitHub
          disables cron on repositories with 60 days of no activity."
          git push
